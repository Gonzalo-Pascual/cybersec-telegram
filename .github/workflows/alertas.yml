name: Alertas de ciberseguridad
on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar una prueba a Telegram'
        type: boolean
        default: false
      preview:
        description: 'En prueba, mostrar ejemplos de alerta y resumen'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cybersec-alertas
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Revisar fuentes y notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_KEYWORDS: php,linux,ubuntu,debian,apache,nginx,wordpress,docker,openssl,openssh,windows,postgresql,mysql,fortinet,cisco
          TEST_MODE: ${{ inputs.test }}
          PREVIEW_MODE: ${{ inputs.preview }}
        run: |
          if [ "$TEST_MODE" = "true" ]; then
            if [ "$PREVIEW_MODE" = "true" ]; then python bot.py --test --preview; else python bot.py --test; fi
          else
            python bot.py
          fi
      - name: Guardar avisos ya vistos
        if: ${{ inputs.test != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar avisos procesados [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
